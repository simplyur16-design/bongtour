name: meta-token-refresh-cron

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  meta-token-refresh:
    name: Trigger Meta token refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping meta-token-refresh endpoint
        env:
          BONGTOUR_CRON_SECRET: ${{ secrets.BONGTOUR_CRON_SECRET }}
        run: |
          if [ -z "$BONGTOUR_CRON_SECRET" ]; then
            echo "::error::GitHub secret BONGTOUR_CRON_SECRET is empty"
            exit 1
          fi

          # Do not use curl -f — we need the body/status on 4xx/5xx for diagnosis.
          response=$(curl -sS \
            -X POST \
            -H "x-bongtour-cron-secret: ${BONGTOUR_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 60 \
            https://bongtour.com/api/cron/meta-token-refresh)

          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $status"
          echo "Response Body: $body"

          if [ "$status" = "401" ]; then
            echo "::error::unauthorized — GitHub BONGTOUR_CRON_SECRET must match production BONGTOUR_CRON_SECRET"
            exit 1
          fi

          if [ "$status" -ne 200 ]; then
            echo "::error::meta-token-refresh failed with status $status"
            exit 1
          fi

          echo "::notice::meta-token-refresh succeeded: $body"
