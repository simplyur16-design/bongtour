<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; height:100%; background:#FFF4EF; overflow-y:auto; box-sizing:border-box;">
  <div style="padding:56px 22px 60px; display:flex; flex-direction:column; gap:22px;">

    <!-- back -->
    <a href="#" onClick="{{ onBackClick }}" style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:#FF6B4A; text-decoration:none;">
      <span style="font-size:16px;">←</span> Back to plans
    </a>

    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div style="height:28px; width:75%; border-radius:8px; background:#EDE9E4;"></div>
        <div style="height:38px; width:45%; border-radius:8px; background:#EDE9E4;"></div>
        <div style="height:150px; width:100%; border-radius:18px; background:#EDE9E4;"></div>
        <div style="height:56px; width:100%; border-radius:16px; background:#EDE9E4;"></div>
      </div>
    </sc-if>

    <sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
      <div style="border:1px dashed #E1DFD9; border-radius:16px; padding:32px 22px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;">
        <div style="font-size:28px;">🔍</div>
        <div style="font-size:15px; font-weight:700; color:#12233F;">Plan not found</div>
        <div style="font-size:13px; color:#6B7686; line-height:1.6; max-width:260px;">This plan may no longer be available. Head back and pick another trip length.</div>
        <a href="#" onClick="{{ onBackClick }}" style="margin-top:6px; font-size:13px; font-weight:600; color:#FF6B4A; text-decoration:none;">Back to plans</a>
      </div>
    </sc-if>

    <sc-if value="{{ showContent }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:22px;">

        <!-- title -->
        <div style="font-size:24px; font-weight:800; color:#12233F; line-height:1.3;">{{ planSummary }}</div>

        <!-- price -->
        <div style="font-size:34px; font-weight:800; color:#FF6B4A;">{{ price }}</div>

        <!-- detail panel -->
        <div style="border:1px solid #E1DFD9; border-radius:18px; background:#fff; padding:18px; display:flex; flex-direction:column; gap:0;">
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #F0EEE9;">
            <span style="font-size:13px; color:#6B7686;">Network</span>
            <span style="font-size:14px; font-weight:700; color:#12233F;">{{ network }}</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #F0EEE9;">
            <span style="font-size:13px; color:#6B7686;">Duration</span>
            <span style="font-size:14px; font-weight:700; color:#12233F;">{{ durationLabel }}</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0;">
            <span style="font-size:13px; color:#6B7686;">Data</span>
            <span style="font-size:14px; font-weight:700; color:#12233F;">{{ dataLabel }}</span>
          </div>
        </div>

        <!-- CTA -->
        <sc-if value="{{ checkoutEnabled }}" hint-placeholder-val="{{ false }}">
          <button style="width:100%; height:56px; border-radius:16px; background:#FF6B4A; border:none; color:#fff; font-family:'Poppins',sans-serif; font-weight:600; font-size:16px; cursor:pointer; box-shadow:0 12px 26px -12px rgba(255,107,74,.6);">Buy now</button>
        </sc-if>
        <sc-if value="{{ checkoutDisabled }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:8px;">
            <button disabled style="width:100%; height:56px; border-radius:16px; background:#E1DFD9; border:none; color:#98A0AB; font-family:'Poppins',sans-serif; font-weight:600; font-size:16px; cursor:not-allowed;">Checkout opening soon</button>
            <div style="font-size:12px; color:#98A0AB; text-align:center; line-height:1.5;">We'll email you the moment online payment goes live.</div>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:700},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;loaded&quot;,&quot;options&quot;:[&quot;loaded&quot;,&quot;loading&quot;,&quot;not_found&quot;],&quot;tsType&quot;:&quot;'loaded' | 'loading' | 'not_found'&quot;},&quot;network&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Roaming&quot;,&quot;options&quot;:[&quot;Roaming&quot;,&quot;Local&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;days&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;dataLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Unlimited&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:32000,&quot;tsType&quot;:&quot;number&quot;},&quot;checkoutEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBackClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  money(n) { return '\u20A9' + n.toLocaleString('en-US'); }

  renderVals() {
    const state = this.props.state ?? 'loaded';
    const network = this.props.network ?? 'Roaming';
    const days = this.props.days ?? 7;
    const dataLabel = this.props.dataLabel ?? 'Unlimited';
    const priceNum = Number(this.props.price ?? 32000);
    const checkoutEnabled = this.props.checkoutEnabled ?? false;

    return {
      isLoading: state === 'loading',
      isNotFound: state === 'not_found',
      showContent: state === 'loaded',
      planSummary: `Korea ${days}-day ${dataLabel} ${network}`,
      price: this.money(priceNum),
      network,
      durationLabel: `${days} days`,
      dataLabel,
      checkoutEnabled: checkoutEnabled,
      checkoutDisabled: !checkoutEnabled,
      onBackClick: (e) => { e.preventDefault(); if (this.props.onBackClick) this.props.onBackClick(); },
    };
  }
}
</script>
</body>
</html>
