<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="700" height="130" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><rect x="10" y="10" width="330" height="92" rx="10" fill="#F4F5F7" stroke="#9AA3AE" stroke-width="1.5"/><text x="175.0" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2530">국내 회선 (메인)</text><text x="175.0" y="55" text-anchor="middle" font-size="11.5" fill="#5B6470">통화·문자 수신용으로 켜 둠</text><text x="175.0" y="72" text-anchor="middle" font-size="11.5" fill="#5B6470">데이터 로밍: 끔</text><text x="175.0" y="89" text-anchor="middle" font-size="11.5" fill="#5B6470">기본 음성 회선: 메인</text><rect x="360" y="10" width="330" height="92" rx="10" fill="#EEF4F9" stroke="#1A7DB4" stroke-width="1.5"/><text x="525.0" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1A7DB4">여행용 eSIM</text><text x="525.0" y="55" text-anchor="middle" font-size="11.5" fill="#5B6470">모바일 데이터 회선으로 지정</text><text x="525.0" y="72" text-anchor="middle" font-size="11.5" fill="#5B6470">로밍망 상품: 데이터 로밍 켬</text><text x="525.0" y="89" text-anchor="middle" font-size="11.5" fill="#5B6470">로컬망 상품: 데이터 로밍 끔</text><text x="350" y="122" text-anchor="middle" font-size="11.5" fill="#5B6470">데이터 전환(셀룰러 데이터 전환 허용)은 끔 — 국내 회선 데이터로 넘어가지 않게</text></svg>