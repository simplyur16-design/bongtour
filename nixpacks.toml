# Playwright install-deps: apt mirror swap + retry (archive.ubuntu.com occasional Packages.gz size mismatch during sync).
[variables]
# Railway Nixpacks next build OOM 방지 (default ~4GB heap 한계)
NODE_OPTIONS = "--max-old-space-size=8192"

[phases.setup]
# Nix python3는 PEP 668(externally-managed) + ensurepip이 /nix/store 수정 불가 → virtualenv로 .venv에만 pip/패키지 설치
nixPkgs = ["nodejs", "python3", "python3Packages.virtualenv", "curl"]

[phases.install]
cmds = [
  "npm install",
  "virtualenv .venv",
  "bash -c 'set -e; for attempt in 1 2 3 4 5; do .venv/bin/pip install --retries 10 --timeout 120 -U pip wheel && exit 0; echo \"[pip bootstrap] attempt ${attempt} failed (PyPI flake), retrying...\"; sleep $((attempt * 15)); done; exit 1'",
  "bash -c 'set -e; for attempt in 1 2 3 4 5; do .venv/bin/pip install --retries 10 --timeout 120 -r scripts/calendar_e2e_scraper_requirements.txt && exit 0; echo \"[pip] attempt ${attempt} failed (PyPI flake), retrying...\"; sleep $((attempt * 15)); done; exit 1'",
  ".venv/bin/playwright install chromium",
  "bash -c 'for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do if [ -f \"$f\" ]; then sed -i \"s|http://archive.ubuntu.com|http://mirror.kakao.com|g; s|https://archive.ubuntu.com|http://mirror.kakao.com|g\" \"$f\"; fi; done; true'",
  "(apt-get update -o Acquire::Retries=5 --fix-missing && .venv/bin/python -m playwright install-deps chromium) || (sleep 35 && apt-get update -o Acquire::Retries=5 --fix-missing && .venv/bin/python -m playwright install-deps chromium)"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
